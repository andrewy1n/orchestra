              except Exception as $ERR:
                ...
              else:
                ...
          - pattern: |
              try:
                ...
              except Exception as $ERR:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except Exception as $ERR:
                ...
              else:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except BaseException:
                ...
          - pattern: |
              try:
                ...
              except BaseException:
                ...
              else:
                ...
          - pattern: |
              try:
                ...
              except BaseException:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except BaseException:
                ...
              else:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except BaseException as $ERR:
                ...
          - pattern: |
              try:
