  - id: orchestra.dynamic-import
    languages: [python]
    severity: ERROR
    message: >-
      import_module, __import__, spec_from_file_location, or exec_module
      is invoked with a non-literal module name or path. Orchestra loads
      plugins through installed entry points; do not import a module or
      file path chosen at runtime.
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: importlib.import_module($MOD, ...)
                  - pattern: import_module($MOD, ...)
                  - pattern: __import__($MOD, ...)
              - pattern-not: importlib.import_module("...", ...)
              - pattern-not: importlib.import_module('...', ...)
              - pattern-not: import_module("...", ...)
              - pattern-not: import_module('...', ...)
              - pattern-not: __import__("...", ...)
              - pattern-not: __import__('...', ...)
          - patterns:
              - pattern-either:
                  - pattern: importlib.util.spec_from_file_location($NAME, $LOC, ...)
                  - pattern: importlib.util.spec_from_file_location($NAME, location=$LOC, ...)
              - pattern-not: importlib.util.spec_from_file_location($NAME, "...", ...)
              - pattern-not: importlib.util.spec_from_file_location($NAME, '...', ...)
              - pattern-not: importlib.util.spec_from_file_location($NAME, location="...", ...)
              - pattern-not: importlib.util.spec_from_file_location($NAME, location='...', ...)
          - pattern: $LOADER.exec_module($MODULE)
