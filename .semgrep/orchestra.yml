          - pattern: |
              try:
                ...
              except:
                ...
          - pattern: |
              try:
                ...
              except:
                ...
              else:
                ...
          - pattern: |
              try:
                ...
              except:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except:
                ...
              else:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except Exception:
                ...
          - pattern: |
              try:
