              except BaseException as $ERR:
                ...
              else:
                ...
          - pattern: |
              try:
                ...
              except BaseException as $ERR:
                ...
              finally:
                ...
          - pattern: |
              try:
                ...
              except BaseException as $ERR:
                ...
              else:
                ...
              finally:
                ...
