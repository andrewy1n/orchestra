name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: python3 scripts/build_skills.py --check
      - run: python3 scripts/check_orchestra_plugin_names.py
      - name: Check Python type and lint policy
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            reason="pull request base"
            if [ -z "$base" ]; then
              echo "::error::Pull request base SHA is missing."
              exit 1
            fi
          elif [ -n "$PUSH_BASE" ] \
            && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$PUSH_BASE" HEAD; then
            base="$PUSH_BASE"
            reason="push before"
          else
            if ! base="$(git merge-base origin/main HEAD)"; then
              echo "::error::Cannot find a merge base with origin/main."
              exit 1
            fi
            reason="merge-base with origin/main"
          fi
          echo "Comparing Python policy against $base ($reason)."
          python3 scripts/check_lint_config.py --base "$base"
      - run: uvx ruff@0.13.1 check .
      - run: uvx ruff@0.13.1 format --check .

  test-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -p no:cacheprovider -n auto --confcutdir=tests/canon tests/canon

  test-tuner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -p no:cacheprovider -n auto --confcutdir=tests/tuner tests/tuner

  test-orchestra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -p no:cacheprovider -n auto tests --ignore=tests/canon --ignore=tests/tuner

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run basedpyright

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run lint
        working-directory: dashboard/frontend
      - run: npm run check
        working-directory: dashboard/frontend
      - run: npm test
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: python3 scripts/wheel_smoke.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard/frontend
      - run: npm run e2e
        working-directory: dashboard/frontend
