name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: python3 -m installer.agents --check
      - run: python3 scripts/check_orchestra_plugin_names.py
      - name: Check Python type and lint policy
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            reason="pull request base"
            if [ -z "$base" ]; then
              echo "::error::Pull request base SHA is missing."
              exit 1
            fi
          elif [ -n "$PUSH_BASE" ] \
            && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$PUSH_BASE" HEAD; then
            base="$PUSH_BASE"
            reason="push before"
          else
            if ! base="$(git merge-base origin/main HEAD)"; then
              echo "::error::Cannot find a merge base with origin/main."
              exit 1
            fi
            reason="merge-base with origin/main"
          fi
          echo "Comparing Python policy against $base ($reason)."
          python3 scripts/check_lint_config.py --base "$base"
      - run: uvx ruff@0.13.1 check .
      - run: uvx ruff@0.13.1 format --check .

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test blocking rules
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --metrics=off --disable-version-check --strict --test --config .semgrep/blocking .semgrep/tests/blocking
      - name: Test advisory rules
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --metrics=off --disable-version-check --strict --test --config .semgrep/advisory .semgrep/tests/advisory
      - name: Test secrets snapshot
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --metrics=off --disable-version-check --strict --test --config .semgrep/vendor .semgrep/tests/vendor
      - name: Scan blocking rules
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --metrics=off --disable-version-check --error --strict \
            --config .semgrep/blocking --config .semgrep/vendor/secrets.yml
      - name: Review broad exception handlers
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --metrics=off --disable-version-check --strict --config .semgrep/advisory \
            --text --output "$RUNNER_TEMP/semgrep-advisory.txt"
          {
            printf '### Broad exception review\n\n'
            printf 'Review each handler against its failure contract. Findings are advisory.\n\n'
            printf '```text\n'
            cat "$RUNNER_TEMP/semgrep-advisory.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  test-canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -p no:cacheprovider -n auto --confcutdir=tests/canon tests/canon

  test-tuner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -p no:cacheprovider -n auto --confcutdir=tests/tuner tests/tuner

  test-orchestra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: uv run pytest -q -p no:cacheprovider -n auto --durations=0 --durations-min=1 tests --ignore=tests/canon --ignore=tests/tuner

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run basedpyright

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run lint
        working-directory: dashboard/frontend
      - run: npm run check
        working-directory: dashboard/frontend
      - run: npm test
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: python3 scripts/wheel_smoke.py

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard/frontend
      - run: npm run e2e
        working-directory: dashboard/frontend
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: dashboard/frontend/test-results/**/trace.zip
          if-no-files-found: ignore
