[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-example-plugins"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."orchestra.composer.ideas"]
example-ideas = "orchestra_example_plugins.ideas:Source"

[project.entry-points."orchestra.tuner.verify"]
example-checks = "orchestra_example_plugins.verify:Technique"

[project.entry-points."orchestra.conductor.land"]
example-land = "orchestra_example_plugins.land:Adapter"

[tool.setuptools.packages.find]
where = ["src"]
