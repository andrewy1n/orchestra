[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-example-plugins"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."orchestra.composer.ideas"]
