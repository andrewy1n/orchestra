[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Product planning through verified code, run by agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "questionary>=2.0,<3",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
orchestra = "orchestra.cli:main"
canon = "orchestra.canon.cli:main"

[tool.setuptools]
# The package lives at the repo root; `bin/orchestra` and skills import it
# with the checkout on PYTHONPATH in the source layout.
packages = [
    "orchestra",
    "orchestra.tools",
    "orchestra.canon",
    "orchestra.score",
    "orchestra.score.schemas",
    "orchestra.composer",
    "orchestra.composer.schemas",
    "orchestra.conductor",
    "orchestra.conductor.briefs",
    "orchestra.conductor.schemas",
    "orchestra.metrics",
    "orchestra.tuner",
    "orchestra.tuner.schemas",
    "orchestra.stage",
    "orchestra.sessions",
    "dashboard",
    "dashboard.backend",
    "dashboard.backend.server",
    "installer",
    "installer.adapters",
]

[tool.setuptools.package-data]
# `_scripts/` is a symlink in the checkout; the wheel builder dereferences it.
orchestra = ["_scripts/*.py"]
"orchestra.canon" = ["py.typed"]
"orchestra.score" = ["schemas/*.json"]
"orchestra.composer" = ["schemas/*.json"]
"orchestra.conductor" = ["schemas/*.json"]
"orchestra.conductor.briefs" = ["sections/*.md"]
"orchestra.tuner" = ["schemas/*.json"]
# `payload/{skills,agents,hosts}` are directory symlinks; the wheel builder dereferences them.
installer = ["providers.json", "payload/**/*"]
dashboard = ["frontend/dist/**/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-rerunfailures",
    "httpx",
    "pyyaml",
    "pip",
    "setuptools",
    "wheel",
    "basedpyright==1.40.2",
    "tomli>=2",
    # 2.15 is the newest import-linter that still runs on Python 3.10.
    "import-linter==2.15",
]

[project.entry-points."canon.schemas"]
score = "orchestra.score.schemas"
conductor = "orchestra.conductor.schemas"
tuner = "orchestra.tuner.schemas"
composer = "orchestra.composer.schemas"

[project.entry-points."orchestra.tuner.verify"]
unit = "orchestra.tuner.plugins:UnitPlugin"
review = "orchestra.conductor.review_technique:ReviewTechnique"

[project.entry-points."orchestra.conductor.land"]
none = "orchestra.conductor.land:NoneAdapter"
github-pr = "orchestra.conductor.land:GitHubPRAdapter"

[project.entry-points."orchestra.plugin_api"]
v1 = "orchestra.canon.extensions:PLUGIN_API_VERSION"

[project.entry-points."orchestra.plugin_config"]
"unit__eyJ0eXBlIjoib2JqZWN0IiwicHJvcGVydGllcyI6eyJydW5uZXIiOnsidHlwZSI6ImFycmF5In19LCJyZXF1aXJlZCI6WyJydW5uZXIiXX0" = "orchestra.tuner.plugins:UnitPlugin"
"review__eyJ0eXBlIjoib2JqZWN0In0" = "orchestra.conductor.review_technique:ReviewTechnique"
"none__eyJ0eXBlIjoib2JqZWN0IiwiYWRkaXRpb25hbFByb3BlcnRpZXMiOmZhbHNlfQ" = "orchestra.conductor.land:NoneAdapter"
"github-pr__eyJhZGRpdGlvbmFsUHJvcGVydGllcyI6ZmFsc2UsInByb3BlcnRpZXMiOnsicmVtb3RlIjp7InR5cGUiOiJzdHJpbmcifSwicmVwb3NpdG9yeSI6eyJ0eXBlIjoic3RyaW5nIn19LCJ0eXBlIjoib2JqZWN0In0" = "orchestra.conductor.land:GitHubPRAdapter"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ERA"]
extend-select = ["TID251"]
ignore = ["E501"]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast" = { msg = "Narrow the value instead of casting it." }

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["orchestra", "dashboard", "installer", "tests", "scripts", "evals"]
strict = ["orchestra", "dashboard", "installer"]
reportIgnoreCommentWithoutRule = "error"
reportExplicitAny = "error"

# Intended package direction, high to low. Tools is the base. Score and tuner
# are the same height and independent. Composer, conductor, and derive are the
# next height and independent of each other, so derive must not import
# conductor. Read models sit above that. Stage sits above the read models and
# below the CLI entry modules, so the CLI may call stage and stage may call
# views, but stage may not call the CLI.
[tool.importlinter]
root_packages = ["orchestra", "dashboard", "installer"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Orchestra package layers"
type = "layers"
containers = ["orchestra"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"
layers = [
    "cli : metrics_cli : plugin_cli : plugin_verify_cli : status_cli : view_cli : workflow_cli",
    "stage",
    "views : store : sessions : metrics",
    "conductor | composer | derive",
    "score | tuner",
    "canon",
    "tools",
]
ignore_imports = [
    # derive.py:12,15,18. Requirement status still lives in conductor.
    "orchestra.derive -> orchestra.conductor.requirements",
]

[[tool.importlinter.contracts]]
name = "Score and tuner are independent"
type = "independence"
modules = ["orchestra.score", "orchestra.tuner"]

[[tool.importlinter.contracts]]
name = "Composer does not import tuner"
type = "forbidden"
source_modules = ["orchestra.composer"]
forbidden_modules = ["orchestra.tuner"]
allow_indirect_imports = false
as_packages = true

[[tool.importlinter.contracts]]
name = "Only the status CLI imports the dashboard"
type = "forbidden"
source_modules = ["orchestra"]
forbidden_modules = ["dashboard"]
allow_indirect_imports = false
as_packages = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # status_cli.py:26-28. The terminal status view reuses the dashboard read model.
    "orchestra.status_cli -> dashboard.backend.gates",
    "orchestra.status_cli -> dashboard.backend.snapshot",
    "orchestra.status_cli -> dashboard.backend.store",
]

[[tool.importlinter.contracts]]
name = "Dashboard does not reach into conductor evidence internals"
type = "forbidden"
source_modules = ["dashboard"]
forbidden_modules = [
    "orchestra.conductor.head_evidence",
    "orchestra.conductor.revision",
]
# Direct imports only. snapshot -> derive -> requirements -> head_evidence and
# phase -> landing -> revision are transitive uses of other contracts' edges.
allow_indirect_imports = true
as_packages = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # phase.py:37. Suite evidence at the phase head.
    "dashboard.backend.phase -> orchestra.conductor.head_evidence",
    # server/service.py:32. Review evidence for the open phase.
    "dashboard.backend.server.service -> orchestra.conductor.head_evidence",
    # approval.py:23. Confirm-modal revision check.
    "dashboard.backend.approval -> orchestra.conductor.revision",
]

[[tool.importlinter.contracts]]
name = "Only the stage install bridge imports installer"
type = "forbidden"
source_modules = ["orchestra", "dashboard"]
forbidden_modules = ["installer"]
allow_indirect_imports = false
as_packages = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # stage/install.py:16-17. Lazy bridge to the checkout-side installer.
    # Any other importer of installer fails this contract.
    "orchestra.stage.install -> installer.model",
    "orchestra.stage.install -> installer.runner",
]

[[tool.importlinter.contracts]]
name = "Installer does not import orchestra or the dashboard"
type = "forbidden"
source_modules = ["installer"]
forbidden_modules = ["orchestra", "dashboard"]
allow_indirect_imports = false
as_packages = true
