[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Product planning through verified code, run by agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "questionary>=2.0,<3",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
orchestra = "orchestra.cli:main"
canon = "orchestra.canon.cli:main"

[tool.setuptools]
# The package lives at the repo root; `bin/orchestra` and skills import it
# with the checkout on PYTHONPATH in the source layout.
packages = [
    "orchestra",
    "orchestra.tools",
    "orchestra.canon",
    "orchestra.score",
    "orchestra.score.planning",
    "orchestra.score.workflow",
    "orchestra.score.facts",
    "orchestra.score.schemas",
    "orchestra.composer",
    "orchestra.composer.schemas",
    "orchestra.conductor",
    "orchestra.conductor.phases",
    "orchestra.conductor.phases.progress",
    "orchestra.conductor.phases.workflow",
    "orchestra.conductor.landing",
    "orchestra.conductor.tasks",
    "orchestra.conductor.tasks.close",
    "orchestra.conductor.tasks.redispatch",
    "orchestra.conductor.tasks.resume",
    "orchestra.conductor.verification.evidence",
    "orchestra.conductor.verification",
    "orchestra.conductor.verification.suite",
    "orchestra.conductor.verification.review",
    "orchestra.conductor.briefs",
    "orchestra.conductor.cli",
    "orchestra.conductor.schemas",
    "orchestra.metrics",
    "orchestra.tuner",
    "orchestra.tuner.plugins",
    "orchestra.tuner.evidence",
    "orchestra.tuner.evidence.signing",
    "orchestra.tuner.authoring",
    "orchestra.tuner.schemas",
    "orchestra.stage",
    "orchestra.views",
    "orchestra.sessions",
    "dashboard",
    "dashboard.backend",
    "dashboard.backend.server",
    "installer",
    "installer.adapters",
]

[tool.setuptools.package-data]
# `_scripts/` is a symlink in the checkout; the wheel builder dereferences it.
orchestra = ["_scripts/*.py"]
"orchestra.canon" = ["py.typed"]
"orchestra.score" = ["schemas/*.json"]
"orchestra.composer" = ["schemas/*.json"]
"orchestra.conductor" = ["schemas/*.json"]
"orchestra.conductor.briefs" = ["sections/*.md"]
"orchestra.tuner" = ["schemas/*.json"]
# `payload/{skills,agents,hosts}` are directory symlinks; the wheel builder dereferences them.
installer = ["providers.json", "payload/**/*"]
dashboard = ["frontend/dist/**/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-rerunfailures",
    "httpx",
    "pyyaml",
    "pip",
    "setuptools",
    "wheel",
    "basedpyright==1.40.2",
    "tomli>=2",
]

[project.entry-points."canon.schemas"]
score = "orchestra.score.schemas"
conductor = "orchestra.conductor.schemas"
tuner = "orchestra.tuner.schemas"
composer = "orchestra.composer.schemas"

[project.entry-points."orchestra.tuner.verify"]
unit = "orchestra.tuner.plugins.api:UnitPlugin"
review = "orchestra.conductor.verification.review.review_technique:ReviewTechnique"

[project.entry-points."orchestra.conductor.land"]
none = "orchestra.conductor.landing.land:NoneAdapter"
github-pr = "orchestra.conductor.landing.land:GitHubPRAdapter"

[project.entry-points."orchestra.conductor.merge_evidence"]
github-actions = "orchestra.conductor.landing.github_evidence:GitHubActionsAdapter"

[project.entry-points."orchestra.plugin_api"]
v2 = "orchestra.canon.extensions:PLUGIN_API_VERSION"

[project.entry-points."orchestra.plugin_config"]
"github-actions__eyJ0eXBlIjoib2JqZWN0IiwiYWRkaXRpb25hbFByb3BlcnRpZXMiOmZhbHNlfQ" = "orchestra.conductor.landing.github_evidence:GitHubActionsAdapter"
