[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Product planning through verified code, run by agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
orchestra = "orchestra.cli:main"
canon = "orchestra.canon.cli:main"

[tool.setuptools]
# The package lives at the repo root; `bin/orchestra` and skills import it
# with the checkout on PYTHONPATH in the source layout.
packages = [
    "orchestra",
    "orchestra.canon",
    "orchestra.score",
    "orchestra.score.schemas",
    "orchestra.composer",
    "orchestra.composer.schemas",
    "orchestra.conductor",
    "orchestra.conductor.schemas",
    "orchestra.tuner",
    "orchestra.tuner.schemas",
    "orchestra.stage",
    "orchestra.sessions",
    "dashboard",
    "dashboard.backend",
    "dashboard.backend.server",
    "installer",
    "installer.adapters",
]

[tool.setuptools.package-data]
# `_scripts/` is a symlink in the checkout; the wheel builder dereferences it.
orchestra = ["_scripts/*.py"]
"orchestra.canon" = ["py.typed"]
"orchestra.score" = ["schemas/*.json"]
"orchestra.composer" = ["schemas/*.json"]
"orchestra.conductor" = ["schemas/*.json"]
"orchestra.tuner" = ["schemas/*.json"]
installer = ["providers.json"]
dashboard = ["frontend/dist/**/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-rerunfailures",
    "httpx",
    "pyyaml",
    "pip",
    "setuptools",
    "wheel",
    "basedpyright==1.40.2",
]

[project.entry-points."canon.schemas"]
score = "orchestra.score.schemas"
conductor = "orchestra.conductor.schemas"
tuner = "orchestra.tuner.schemas"
composer = "orchestra.composer.schemas"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ERA"]
extend-select = ["TID251"]
ignore = ["E501"]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast" = { msg = "Narrow the value instead of casting it." }

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["orchestra", "dashboard", "installer"]
strict = ["orchestra/canon", "orchestra/composer", "orchestra/store.py"]
reportIgnoreCommentWithoutRule = "error"

[[tool.basedpyright.executionEnvironments]]
root = "orchestra/canon"
extraPaths = ["."]
reportExplicitAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "orchestra/composer"
extraPaths = ["."]
reportExplicitAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "orchestra/store.py"
extraPaths = ["."]
reportExplicitAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "."
extraPaths = ["."]
