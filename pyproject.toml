[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ERA"]
extend-select = ["TID251"]
ignore = ["E501"]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast" = { msg = "Narrow the value instead of casting it." }

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["orchestra", "dashboard", "installer", "tests", "scripts", "evals"]
strict = ["orchestra", "dashboard", "installer"]
reportIgnoreCommentWithoutRule = "error"
reportExplicitAny = "error"
reportUnnecessaryTypeIgnoreComment = "error"
